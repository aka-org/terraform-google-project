name: Release

# On every push to main: run the checks, then release the version named
# by the first "## X.Y.Z" heading of CHANGELOG.md if it isn't out yet (an
# annotated tag vX.Y.Z, which the Terraform Registry publishes from, and
# a GitHub release with that changelog section). Changes not yet released
# go under a "## Unreleased" heading.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: release

jobs:
  checks:
    uses: aka-org/gcp-infra/.github/workflows/terraform-module-ci.yml@main

  release:
    needs: checks
    permissions:
      contents: write
    uses: aka-org/gcp-infra/.github/workflows/changelog-release.yml@main
